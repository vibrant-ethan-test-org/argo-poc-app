# Build and push the images. That is all CI does: Harness sees the new argo-poc-app tag in GHCR and
# runs the release pipeline (test with blue-green + e2e, approval, prod). The git tag of the same name
# pins the deploy/ manifests Harness uses to this commit, and the e2e image is pushed before the app
# image so it exists when the pipeline starts.
name: ci
run-name: ${{ inputs.e2e_id && format('e2e {0}', inputs.e2e_id) || '' }}

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    # promotion-controller e2e tests (test/e2e there) build releases of main's commit with these.
    inputs:
      e2e_id:
        description: Run id of a promotion-controller e2e test; shown in the run name so the test finds its run
        required: false
        default: ""
      e2e_fail:
        description: Stage whose e2e this build fails (E2E_FAIL), or none for a normal build
        type: choice
        options: [none, test, staging, prod]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  VERSION: v0.2.${{ github.run_number }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the commit
        if: github.event_name != 'pull_request'
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
      - name: Build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: e2e image
        uses: docker/build-push-action@v6
        with:
          context: e2e
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            E2E_FAIL=${{ inputs.e2e_fail != 'none' && inputs.e2e_fail || '' }}
          tags: ${{ env.REGISTRY }}/argo-poc-e2e:${{ env.VERSION }}
          annotations: |
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
      - name: app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/argo-poc-app:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          annotations: |
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.version=${{ env.VERSION }}
            index,manifest:org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
