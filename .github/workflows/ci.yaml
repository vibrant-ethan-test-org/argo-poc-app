# Build and push the images. Harness sees the new argo-poc-app tag in GHCR and
# runs the release pipeline (test with blue-green + e2e, approval, prod). The git tag of the same name
# pins the deploy/ manifests Harness uses to this commit, and the e2e image is pushed before the app
# image so it exists when the pipeline starts.
# On main, the descriptor job then publishes the build's release descriptor for the promotion controller
# (promotion-controller D-072) through the vendored, hash-checked shared action in .github/actions/release-descriptor.
name: ci
run-name: ${{ inputs.e2e_id && format('e2e {0}', inputs.e2e_id) || '' }}

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    # promotion-controller e2e tests (test/e2e there) build releases of main's commit with these.
    inputs:
      e2e_id:
        description: Run id of a promotion-controller e2e test ([A-Za-z0-9-]); shown in the run name so the test finds its run
        required: false
        default: ""
      source_commit:
        description: Optional full commit SHA reachable from main (controller revert acceptance)
        required: false
        default: ""
      e2e_fail:
        description: Stage whose e2e this build fails (E2E_FAIL), or none for a normal build
        type: choice
        options: [none, test, staging, prod]
        default: none
      unhealthy_after:
        description: Make staging readiness fail after this duration (controller UC5)
        type: choice
        options: [none, 20s]
        default: none
      initialize_journal:
        description: Write the release-descriptor journal's sequence 0 when it has no head (once, D-072)
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  VERSION: v0.2.${{ github.run_number }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ env.VERSION }}
      e2e_digest: ${{ steps.e2e_build.outputs.digest }}
      e2e_completed_at: ${{ steps.e2e_build_done.outputs.at }}
      app_digest: ${{ steps.app_build.outputs.digest }}
      app_completed_at: ${{ steps.app_build_done.outputs.at }}
    permissions:
      contents: write # push the release tag
      packages: write
    steps:
      # Releases come only from main (the controller's lineage check, D-041): refuse a dispatch on any other ref
      # before anything is tagged or pushed.
      - name: Main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::dispatch only on main, not $GITHUB_REF"
          exit 1
      # Dispatch inputs reach the run name and the build (E2E_FAIL): accept only known values.
      - name: Inputs
        id: inputs
        env:
          E2E_ID: ${{ inputs.e2e_id }}
          E2E_FAIL: ${{ inputs.e2e_fail }}
          UNHEALTHY_AFTER: ${{ inputs.unhealthy_after }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ -z "$SOURCE_COMMIT" || "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_commit must be a full lowercase commit SHA"; exit 1; }
          [[ "$E2E_ID" =~ ^[A-Za-z0-9-]*$ ]] || { echo "::error::e2e_id must match [A-Za-z0-9-]*"; exit 1; }
          case "$E2E_FAIL" in
            ""|none) fail= ;;
            test|staging|prod) fail=$E2E_FAIL ;;
            *) echo "::error::e2e_fail must be none, test, staging or prod"; exit 1 ;;
          esac
          echo "e2e_fail=$fail" >> "$GITHUB_OUTPUT"
          case "$UNHEALTHY_AFTER" in
            ""|none) unhealthy= ;;
            20s) unhealthy=20s ;;
            *) echo "::error::unhealthy_after must be none or 20s"; exit 1 ;;
          esac
          echo "unhealthy_after=$unhealthy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select source commit
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ -n "$SOURCE_COMMIT" ]]; then
            git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main || { echo "::error::source_commit must be reachable from main"; exit 1; }
            git checkout --detach "$SOURCE_COMMIT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tag the commit
        if: github.event_name != 'pull_request'
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
      - name: Build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: e2e image
        id: e2e_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: e2e
          platforms: linux/amd64,linux/arm64
          build-args: |
            E2E_FAIL=${{ steps.inputs.outputs.e2e_fail }}
          # Pushed by digest, untagged; the Release tags step tags it VERSION.
          outputs: type=image,name=${{ env.REGISTRY }}/argo-poc-e2e,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          annotations: |
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            index,manifest:org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
      - name: e2e build completed
        id: e2e_build_done
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: app image
        id: app_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pushed by digest, untagged; the Release tags step tags it VERSION.
          outputs: type=image,name=${{ env.REGISTRY }}/argo-poc-app,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ steps.source.outputs.commit }}
            UNHEALTHY_AFTER=${{ steps.inputs.outputs.unhealthy_after }}
          annotations: |
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            index,manifest:org.opencontainers.image.version=${{ env.VERSION }}
            index,manifest:org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
      - name: app build completed
        id: app_build_done
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Release tags last, back to back, to keep the window in which a registry poller sees only some of the build's
      # images as short as possible; it isn't zero (D-057). All of a commit's builds share its revision, and one
      # image's new tag next to another's old one would look like a new set (promotion-controller T09, D-041).
      # The images were pushed untagged; each tag is a PUT of the exact manifest
      # the build step reported, fetched by digest, so the digest and the index annotations stay as built.
      - name: Release tags
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          IMAGES: argo-poc-e2e=${{ steps.e2e_build.outputs.digest }} argo-poc-app=${{ steps.app_build.outputs.digest }}
        run: |
          set -o pipefail
          accept=application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json
          accept=$accept,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json
          dir=$(mktemp -d)
          declare -A bearer type digest
          for entry in $IMAGES; do
            image=${entry%=*} digest[$image]=${entry#*=}
            [[ "${digest[$image]}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$image: no digest from its build step"; exit 1; }
            bearer[$image]=$(curl -fsS -u "$ACTOR:$TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$OWNER/$image:pull,push" | jq -r .token)
            echo "::add-mask::${bearer[$image]}"
            curl -fsS --retry 5 -H "Authorization: Bearer ${bearer[$image]}" -H "Accept: $accept" -D "$dir/$image.h" \
              -o "$dir/$image.m" "https://ghcr.io/v2/$OWNER/$image/manifests/${digest[$image]}"
            [[ "sha256:$(sha256sum < "$dir/$image.m" | cut -d' ' -f1)" == "${digest[$image]}" ]] ||
              { echo "::error::$image: fetched manifest does not match ${digest[$image]}"; exit 1; }
            type[$image]=$(tr -d '\r' < "$dir/$image.h" | awk -F': ' 'tolower($1) == "content-type" {print $2}')
          done
          # Every manifest is fetched first, so only the tag PUTs remain, one right after another. A PUT that fails is
          # retried with backoff; if one still fails after another succeeded, the job fails saying the tag is partial.
          tagged=
          for entry in $IMAGES; do
            image=${entry%=*}
            for attempt in 1 2 3 4 5; do
              got=$(curl -fsS -X PUT -H "Authorization: Bearer ${bearer[$image]}" -H "Content-Type: ${type[$image]}" \
                --data-binary "@$dir/$image.m" -D - -o /dev/null "https://ghcr.io/v2/$OWNER/$image/manifests/$VERSION" |
                tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}') && break
              got=
              [[ "$attempt" == 5 ]] || sleep $((attempt * 3))
            done
            if [[ "$got" != "${digest[$image]}" ]]; then
              [[ -z "$tagged" ]] || echo "::error::release tag $VERSION is partial: set on$tagged, not on $image"
              echo "::error::$image: tagging $VERSION failed"
              exit 1
            fi
            tagged="$tagged $image"
            echo "$image:$VERSION -> $got"
          done

  # Publishes this run's release descriptor (promotion-controller D-072, docs/design/23-release-descriptors.md §23.4)
  # through the vendored copy of the shared action, after checking its recorded hashes. It runs only when every image
  # job succeeded on main, takes digests from those jobs' outputs and never resolves a tag. It has no deployment
  # credentials: only the job token, scoped to this repository's packages.
  descriptor:
    needs: release
    # A source_commit build is of an older commit than this run's GITHUB_SHA, which the publisher refuses.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.source_commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-descriptor-argo-poc-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the vendored action
        working-directory: .github/actions/release-descriptor
        run: |
          set -euo pipefail
          [[ -z "$(find . ! -type f ! -type d)" ]] || { echo "::error::vendored action: unexpected file type"; exit 1; }
          diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) \
            <(grep -v '^#' SHA256SUMS | sed -E 's/^[0-9a-f]{64}  //' | LC_ALL=C sort) ||
            { echo "::error::vendored action: file set differs from SHA256SUMS"; exit 1; }
          grep -v '^#' SHA256SUMS | sha256sum --strict --check --quiet
      - name: Collect build outputs
        env:
          COMMIT: ${{ needs.release.outputs.commit }}
          VERSION: ${{ needs.release.outputs.version }}
          E2E_DIGEST: ${{ needs.release.outputs.e2e_digest }}
          E2E_COMPLETED_AT: ${{ needs.release.outputs.e2e_completed_at }}
          APP_DIGEST: ${{ needs.release.outputs.app_digest }}
          APP_COMPLETED_AT: ${{ needs.release.outputs.app_completed_at }}
        run: |
          set -euo pipefail
          workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg commit "$COMMIT" --arg workflow "${workflow%%@*}" \
            --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" --arg version "$VERSION" \
            --arg owner "$GITHUB_REPOSITORY_OWNER" '{schemaVersion: 1, run: {repository: $repository, commit: $commit, workflow: $workflow, runId: $runId, runAttempt: $runAttempt}, version: $version, images: [{image: ("ghcr.io/" + $owner + "/argo-poc-app"), tag: $version, digest: env.APP_DIGEST, commit: $commit, completedAt: env.APP_COMPLETED_AT, result: "success"}, {image: ("ghcr.io/" + $owner + "/argo-poc-e2e"), tag: $version, digest: env.E2E_DIGEST, commit: $commit, completedAt: env.E2E_COMPLETED_AT, result: "success"}]}' > "$RUNNER_TEMP/build-outputs.json"
      - uses: ./.github/actions/release-descriptor
        with:
          build-outputs-file: ${{ runner.temp }}/build-outputs.json
          initialize-journal: ${{ inputs.initialize_journal == 'true' }}
