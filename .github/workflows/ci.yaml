# Build and push the images. That is all CI does: Harness sees the new argo-poc-app tag in GHCR and
# runs the release pipeline (test with blue-green + e2e, approval, prod). The git tag of the same name
# pins the deploy/ manifests Harness uses to this commit, and the e2e image is pushed before the app
# image so it exists when the pipeline starts.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  VERSION: v0.2.${{ github.run_number }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the commit
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: e2e image
        uses: docker/build-push-action@v6
        with:
          context: e2e
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/argo-poc-e2e:${{ env.VERSION }}
      - name: app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/argo-poc-app:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
