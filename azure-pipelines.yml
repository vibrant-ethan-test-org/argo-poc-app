# Azure Pipelines version of the Kargo flow: build once, deploy to test, soak, auto-promote to prod.
# There is no cluster, so a "deploy" runs the image on the build agent and gates it with the real e2e image.
# Holds live on the Azure DevOps environments argo-poc-test and argo-poc-prod (Pipelines → Environments → Approvals and checks);
# see .azure/README.md. The emergency parameter skips test and the soak, with a sign-off on argo-poc-prod-emergency.
name: v1.0.$(Rev:r)

trigger:
  branches:
    include: [main]
  paths:
    exclude: ['**/*.md']

pr: none

parameters:
  - name: failTestE2E
    displayName: Simulate a broken release (e2e fails in test)
    type: boolean
    default: false
  - name: soakMinutes
    displayName: Soak time in test before prod (minutes)
    type: number
    default: 1
  - name: emergency
    displayName: "Emergency: skip test and soak, deploy straight to prod (needs sign-off)"
    type: boolean
    default: false
  - name: ignoreBusinessHours
    displayName: Deploy to prod outside business hours
    type: boolean
    default: false

variables:
  - name: appImage
    value: argo-poc-app:$(Build.BuildNumber)
  - name: e2eImage
    value: argo-poc-e2e:$(Build.BuildNumber)
  # Deploy from main, or from any branch when someone starts the run by hand.
  - name: canDeploy
    value: $[or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'))]
  # Prod deploy window. Outside it, a run waits at the Business hours stage until the window opens,
  # unless someone clicks Resume on that run (or starts it with "Deploy to prod outside business hours").
  - name: windowTimeZone
    value: America/New_York
  - name: windowDays
    value: Mon,Tue,Wed,Thu,Fri
  - name: windowStart
    value: '09:00'
  - name: windowEnd
    value: '17:00'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: images
        displayName: Build images
        steps:
          - script: |
              set -euo pipefail
              docker build -t $(appImage) --build-arg VERSION=$(Build.BuildNumber) --build-arg COMMIT=$(Build.SourceVersion) .
              docker build -t $(e2eImage) e2e
              mkdir -p $(Build.ArtifactStagingDirectory)/images
              docker save -o $(Build.ArtifactStagingDirectory)/images/images.tar $(appImage) $(e2eImage)
            displayName: Build app and e2e images
            env:
              DOCKER_BUILDKIT: '1'
          - publish: $(Build.ArtifactStagingDirectory)/images
            artifact: images
            displayName: Publish images (the same build goes to test and prod)

  - ${{ if not(parameters.emergency) }}:
    - stage: Test
      dependsOn: Build
      condition: and(succeeded(), eq(variables.canDeploy, 'true'))
      variables:
        ${{ if parameters.failTestE2E }}:
          expectedSha: simulated-bad-commit
        ${{ else }}:
          expectedSha: $(Build.SourceVersion)
      jobs:
        - deployment: deploy
          displayName: Deploy to test
          environment: argo-poc-test
          strategy:
            runOnce:
              deploy:
                steps:
                  - template: .azure/deploy-steps.yml
                    parameters:
                      env: test
                      expectedSha: $(expectedSha)
        - job: soak
          displayName: Soak in test
          dependsOn: deploy
          pool: server
          steps:
            - task: Delay@1
              displayName: Wait ${{ parameters.soakMinutes }} minute(s) before prod
              inputs:
                delayForMinutes: '${{ parameters.soakMinutes }}'

  - ${{ if and(not(parameters.emergency), not(parameters.ignoreBusinessHours)) }}:
    - stage: Window
      displayName: Business hours
      dependsOn: Test
      condition: and(succeeded(), eq(variables.canDeploy, 'true'))
      jobs:
        - job: check
          displayName: Check the prod deploy window
          steps:
            - checkout: none
            - script: |
                python3 - <<'EOF'
                import datetime as dt, math, os, zoneinfo
                tz = zoneinfo.ZoneInfo(os.environ["WINDOW_TZ"])
                days = os.environ["WINDOW_DAYS"].split(",")
                start, end = dt.time.fromisoformat(os.environ["WINDOW_START"]), dt.time.fromisoformat(os.environ["WINDOW_END"])
                now = dt.datetime.now(tz)
                wait = 0
                if not (now.strftime("%a") in days and start <= now.time() < end):
                    opens = next(o for i in range(8)
                                 for o in [dt.datetime.combine(now.date() + dt.timedelta(days=i), start, tz)]
                                 if o > now and o.strftime("%a") in days)
                    wait = math.ceil((opens - now).total_seconds() / 60)
                    print(f"Outside the prod window ({','.join(days)} {start:%H:%M}-{end:%H:%M} {tz}). Now {now:%a %H:%M}; opens {opens:%a %H:%M}, in {wait} min.")
                else:
                    print(f"Inside the prod window. Now {now:%a %H:%M} {tz}.")
                print(f"##vso[task.setvariable variable=open;isOutput=true]{'true' if wait == 0 else 'false'}")
                print(f"##vso[task.setvariable variable=waitMinutes;isOutput=true]{wait}")
                EOF
              name: window
              displayName: Is prod open now?
              env:
                WINDOW_TZ: $(windowTimeZone)
                WINDOW_DAYS: $(windowDays)
                WINDOW_START: $(windowStart)
                WINDOW_END: $(windowEnd)
        # The validation times out (and resumes) when the window opens. Resume deploys this run now; Reject blocks it.
        # onTimeout only applies to the task's own timeout; a job timeout would fail the run, so the job gets 7 days.
        - job: wait
          displayName: Wait for business hours
          dependsOn: check
          condition: eq(dependencies.check.outputs['window.open'], 'false')
          pool: server
          timeoutInMinutes: 10080
          variables:
            waitMinutes: $[ dependencies.check.outputs['window.waitMinutes'] ]
          steps:
            - task: ManualValidation@1
              displayName: Outside business hours. Resume to deploy this run now
              timeoutInMinutes: $(waitMinutes)
              inputs:
                notifyUsers: ethan.liu@vibrantsci.com
                approvers: ethan.liu@vibrantsci.com
                instructions: $(Build.BuildNumber) is waiting for the prod deploy window ($(windowDays) $(windowStart)-$(windowEnd) $(windowTimeZone)) and goes to prod by itself when it opens. Resume to deploy this run now; Reject to stop it. Other waiting runs are not affected.
                onTimeout: resume

  # Emergency path: no test deploy and no soak, but a person must sign off on argo-poc-prod-emergency (always-on Approvals check),
  # and prod still runs e2e against the new version before switching. That environment's history lists every emergency release.
  - ${{ if parameters.emergency }}:
    - stage: Emergency
      displayName: Emergency sign-off
      dependsOn: Build
      condition: and(succeeded(), eq(variables.canDeploy, 'true'))
      jobs:
        - deployment: signoff
          displayName: Sign-off to skip test
          environment: argo-poc-prod-emergency
          strategy:
            runOnce:
              deploy:
                steps:
                  - download: none
                  - script: |
                      echo "##vso[build.addbuildtag]emergency"
                      echo "##vso[task.logissue type=warning]Emergency release: $(Build.BuildNumber) skips test and goes straight to prod. Started by $(Build.RequestedFor)."
                    displayName: Record emergency release

  - stage: Prod
    ${{ if parameters.emergency }}:
      dependsOn: Emergency
    ${{ elseif parameters.ignoreBusinessHours }}:
      dependsOn: Test
    ${{ else }}:
      dependsOn: Window
    condition: and(succeeded(), eq(variables.canDeploy, 'true'))
    # With an Exclusive lock check on argo-poc-prod, a newer run waiting for prod cancels older waiting runs.
    lockBehavior: runLatest
    jobs:
      # The lock only cancels older runs that are already waiting when a newer one asks for it, so an older run
      # can still get the lock after a newer one deployed. Skip it then; re-running the stage by hand still deploys (rollback).
      - job: guard
        displayName: Check prod has no newer build
        steps:
          - checkout: none
          - script: |
              set -euo pipefail
              api="$(System.CollectionUri)$(System.TeamProject)/_apis/distributedtask/environments"
              auth="Authorization: Bearer $SYSTEM_ACCESSTOKEN"
              env_id=$(curl -fsS -H "$auth" "$api?name=argo-poc-prod&api-version=7.1" | jq -r '.value[0].id')
              # The latest successful deployment record is what prod runs now (a rollback can make it an older run).
              current=$(curl -fsS -H "$auth" "$api/$env_id/environmentdeploymentrecords?top=50&api-version=7.1" \
                | jq -r '[.value[] | select(.result == "succeeded")] | max_by(.id) // {} | .owner // {} | "\(.id // 0) \(.name // "none")"')
              read -r current_id current_name <<<"$current"
              echo "Prod runs: $current_name (run $current_id); this run: $(Build.BuildNumber) (run $(Build.BuildId)), stage attempt $(System.StageAttempt)"
              skip=false
              if [ "$current_id" -gt "$(Build.BuildId)" ] && [ "$(System.StageAttempt)" = 1 ]; then
                skip=true
                echo "##vso[task.logissue type=warning]Prod already runs newer build $current_name, so $(Build.BuildNumber) is not deployed. Re-run the Prod stage to deploy it anyway."
              fi
              echo "##vso[task.setvariable variable=skip;isOutput=true]$skip"
            name: newer
            displayName: Compare with the newest build in prod
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - deployment: deploy
        displayName: Deploy to prod
        dependsOn: guard
        condition: and(succeeded(), ne(dependencies.guard.outputs['newer.skip'], 'true'))
        environment: argo-poc-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - template: .azure/deploy-steps.yml
                  parameters:
                    env: prod
                    expectedSha: $(Build.SourceVersion)
