# Harness blue-green renames this to {{.Values.name}}-blue / -green and adds a harness.io/color label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
  labels:
    app: {{.Values.name}}
spec:
  replicas: {{.Values.replicas}}
  selector:
    matchLabels:
      app: {{.Values.name}}
  template:
    metadata:
      labels:
        app: {{.Values.name}}
      annotations:
        app.version: "{{.Values.version}}"
    spec:
      containers:
        - name: app
          image: {{.Values.image}}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: "{{.Values.env}}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
