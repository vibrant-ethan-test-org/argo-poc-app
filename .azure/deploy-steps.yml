# Simulated blue-green deploy on the build agent: start the new version, run e2e against it, then "switch traffic".
# A failing e2e fails the stage, which stops the release before the next environment.
parameters:
  - name: env
    type: string
  - name: expectedSha
    type: string

steps:
  - script: docker load -i $(Pipeline.Workspace)/images/images.tar
    displayName: Load images built in this run

  - script: |
      set -euo pipefail
      docker run -d --name green -p 8080:8080 -e APP_ENV=${{ parameters.env }} $(appImage)
      for i in $(seq 1 30); do
        curl -fsS http://localhost:8080/healthz >/dev/null && break
        sleep 1
      done
      curl -fsS http://localhost:8080/version
    displayName: Start new version (green) in ${{ parameters.env }}

  - script: |
      set -euo pipefail
      docker run --rm --network host -e TARGET_URL=http://localhost:8080 -e EXPECTED_SHA=${{ parameters.expectedSha }} $(e2eImage)
    displayName: e2e against green

  - script: |
      set -euo pipefail
      cat > $(Agent.TempDirectory)/deploy.md <<EOF
      ### ${{ parameters.env }}: $(Build.BuildNumber)
      | | |
      |---|---|
      | Version | \`$(Build.BuildNumber)\` |
      | App commit | [\`$(Build.SourceVersion)\`]($(Build.Repository.Uri)/commit/$(Build.SourceVersion)) |
      | Environment | \`argo-poc-${{ parameters.env }}\` |
      EOF
      echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/deploy.md"
      echo "e2e passed: traffic would switch to $(Build.BuildNumber) in ${{ parameters.env }} (simulated, no cluster)"
    displayName: Switch traffic (simulated)

  - script: docker rm -f green || true
    displayName: Clean up
    condition: always()
